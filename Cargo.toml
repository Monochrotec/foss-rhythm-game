[package]
name = "foss-rhythm-game"
version = "0.1.0"
edition = "2024"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a decent amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 2

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["2d", "audio", "bevy_settings", "debug", "dynamic_linking", "ui"] }
